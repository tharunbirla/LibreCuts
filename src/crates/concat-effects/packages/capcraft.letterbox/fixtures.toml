# The bars stay at the edges, a quarter of the height at most; the probe pixel
# in the middle is the picture as it went in.

[[probe]]
name = "default, a grey"
input = [0.18, 0.18, 0.18, 1]
expect = [0.18, 0.18, 0.18, 1]

[[probe]]
name = "default, a highlight past white"
input = [4, 1, 0.05, 1]
expect = [4, 1, 0.05, 1]

[[probe]]
name = "default, half transparent"
input = [0.5, 0.2, 0.1, 0.5]
expect = [0.5, 0.2, 0.1, 0.5]

[[probe]]
name = "minimum, a highlight past white"
at = "min"
input = [4, 1, 0.05, 1]
expect = [4, 1, 0.05, 1]

[[probe]]
name = "maximum, a highlight past white"
at = "max"
input = [4, 1, 0.05, 1]
expect = [4, 1, 0.05, 1]

[[probe]]
name = "maximum, half transparent"
at = "max"
input = [0.5, 0.2, 0.1, 0.5]
expect = [0.5, 0.2, 0.1, 0.5]
