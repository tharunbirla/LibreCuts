name: CapCraft Android CI
on:
  push:
    branches: [feature/capcraft-base]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: capcraft-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust
        working-directory: src
        run: rustup toolchain install
      - name: Caption formatting tests
        working-directory: src
        run: |
          rustc --test crates/capcraft-android/src/caption_text.rs -o "$RUNNER_TEMP/caption-tests"
          "$RUNNER_TEMP/caption-tests"
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      GGML_NATIVE: "OFF"
      NDK_VERSION: 29.0.14206865
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y cmake libclang-dev
      - name: Install Rust and Android target
        working-directory: src
        run: |
          rustup toolchain install
          rustup target add aarch64-linux-android
      - name: Install cargo-ndk and NDK
        run: |
          cargo install cargo-ndk --version 4.1.2 --locked
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Build FFmpeg
        run: src/scripts/ffmpeg-mobile.sh aarch64-linux-android
      - name: Prepare sherpa-onnx
        run: src/scripts/sherpa-mobile.sh aarch64-linux-android
      - name: Assemble debug APK
        run: |
          cd src
          eval "$(scripts/mobile-env.sh aarch64-linux-android)"
          cd crates/capcraft-android/android
          ./gradlew assembleDebug -Pcapcraft.abis=arm64-v8a --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: capcraft-debug-arm64
          path: src/crates/capcraft-android/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
